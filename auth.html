<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRUBIX — تسجيل الدخول</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap { min-height: 88vh; display:flex; align-items:center; justify-content:center; padding: 60px 20px; }
  .auth-card { width:100%; max-width: 420px; }
  .tabs { display:flex; background: var(--bg-sunken); border-radius: 999px; padding: 4px; margin-bottom: 32px; }
  .tabs button { flex:1; padding:12px; border-radius:999px; font-weight:700; font-size:14px; color:var(--text-muted); }
  .tabs button.active { background: var(--bg-elevated); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .divider { display:flex; align-items:center; gap:12px; color:var(--text-muted); font-size:13px; margin: 22px 0; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo brand-logo"><img src="img/logo.png" alt="SCRUBIX" class="brand-mark">SCRUBIX</a>
    <div class="header-actions"><button class="theme-toggle"></button></div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="tabs">
      <button class="active" id="tab-login" onclick="showTab('login')">تسجيل الدخول</button>
      <button id="tab-signup" onclick="showTab('signup')">حساب جديد</button>
    </div>

    <div id="panel-login">
      <div class="field"><label>البريد الإلكتروني أو رقم الهاتف</label><input type="text" placeholder="example@email.com"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" placeholder="••••••••"></div>
      <div class="flex-between mt-8" style="font-size:13px;">
        <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" style="width:auto;"> تذكرني</label>
        <a href="#" class="muted">نسيت كلمة المرور؟</a>
      </div>
      <button class="btn btn-primary btn-block mt-24" onclick="location.href='profile.html'">دخول</button>
    </div>

    <div id="panel-signup" style="display:none;">
      <div class="field"><label>الاسم بالكامل</label><input type="text" placeholder="اسمك"></div>
      <div class="field"><label>رقم الهاتف</label><input type="tel" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" placeholder="example@email.com"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block mt-24" onclick="location.href='profile.html'">إنشاء الحساب</button>
    </div>

    <div class="divider">أو</div>
    <button class="btn btn-outline btn-block">المتابعة كزائر</button>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  function showTab(t){
    document.getElementById('tab-login').classList.toggle('active', t==='login');
    document.getElementById('tab-signup').classList.toggle('active', t==='signup');
    document.getElementById('panel-login').style.display = t==='login' ? 'block':'none';
    document.getElementById('panel-signup').style.display = t==='signup' ? 'block':'none';
  }
</script>
</body>
</html>
